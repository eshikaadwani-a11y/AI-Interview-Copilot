# ── AI Interview Copilot — local orchestration ────────────────
# Brings up MongoDB, the FastAPI backend, and the Next.js frontend.
# ChromaDB is embedded in the backend (persistent on a volume).

services:
  mongo:
    image: mongo:7
    container_name: aic-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: aic-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=ai_interview_copilot
      - CORS_ORIGINS=http://localhost:3000
      - CHROMA_PERSIST_DIR=/app/.chroma
      - MODELS_DIR=/app/models
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - backend_chroma:/app/.chroma
      - backend_uploads:/app/uploads
      - backend_models:/app/models

  frontend:
    build:
      context: ./frontend
    container_name: aic-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  backend_chroma:
  backend_uploads:
  backend_models:
